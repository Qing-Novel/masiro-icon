name: Release Build Manual

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug

env:
  CI_FLUTTER_VERSION: "3.24.5"
  BUILD_TOOLS_VERSION: "34.0.0"
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  android-fat:
    name: Android | Build Fat Full APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.CI_FLUTTER_VERSION }}
          cache: true

      - name: Install system libs
        run: |
          sudo apt update -y
          sudo apt install -y curl unzip xz-utils zip libglu1-mesa clang cmake ninja-build pkg-config libayatana-appindicator3-dev libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Get short commit hash
        run: echo "COMMIT_SHORT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Flutter pub get
        run: flutter pub get

      - name: Build full fat release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare output folder
        run: |
          mkdir -p fat-apk
          cp build/app/outputs/flutter-apk/app-release.apk fat-apk/masiro-${{ env.COMMIT_SHORT_HASH }}-fat-release.apk
          ls -la fat-apk

      - name: Locate Android build tools
        run: |
          export ANDROID_BUILD_TOOLS=${{ env.ANDROID_SDK_ROOT }}/build-tools/${{ env.BUILD_TOOLS_VERSION }}
          echo "ANDROID_BUILD_TOOLS=$ANDROID_BUILD_TOOLS" >> $GITHUB_ENV
          ls "$ANDROID_BUILD_TOOLS"/
          test -f "$ANDROID_BUILD_TOOLS/zipalign"
          test -f "$ANDROID_BUILD_TOOLS/apksigner"

      - name: Decode keystore base64 & parse key properties
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > fat-apk/sign.keystore
          echo "${{ secrets.KEY_PROPERTIES }}" > fat-apk/key.properties
          # 读取密钥信息
          source fat-apk/key.properties
          echo "KS_ALIAS=$keyAlias" >> $GITHUB_ENV
          echo "KS_PASSWORD=$storePassword" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$keyPassword" >> $GITHUB_ENV
          ls -la fat-apk

      - name: Zipalign and sign fat apk
        run: |
          cd fat-apk
          ANDROID_BUILD_TOOLS=${{ env.ANDROID_BUILD_TOOLS }}
          src_apk=masiro-${{ env.COMMIT_SHORT_HASH }}-fat-release.apk
          "${ANDROID_BUILD_TOOLS}/zipalign" -v 4 "$src_apk" "${src_apk%.apk}-aligned.apk"
          "${ANDROID_BUILD_TOOLS}/apksigner" sign \
            --ks sign.keystore \
            --ks-key-alias ${{ env.KS_ALIAS }} \
            --ks-pass pass:${{ env.KS_PASSWORD }} \
            --key-pass pass:${{ env.KEY_PASSWORD }} \
            --out "${src_apk%.apk}-signed.apk" \
            "${src_apk%.apk}-aligned.apk"
          ls -la .

      - name: Upload to release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: "fat-apk/masiro-${{ env.COMMIT_SHORT_HASH }}-fat-release-signed.apk"
          tag: ${{ env.COMMIT_SHORT_HASH }}
          prerelease: true

  android-split:
    name: Android | Build Split ABI APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.CI_FLUTTER_VERSION }}
          cache: true

      - name: Install system libs
        run: |
          sudo apt update -y
          sudo apt install -y curl unzip xz-utils zip libglu1-mesa clang cmake ninja-build pkg-config libayatana-appindicator3-dev libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Get short commit hash
        run: echo "COMMIT_SHORT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Set release dir env
        run: echo "RELEASE_DIR=split-apk" >> $GITHUB_ENV

      - name: Flutter pub get
        run: flutter pub get

      - name: Build split per abi APK
        run: flutter build apk --split-per-abi --no-tree-shake-icons

      - name: Copy & rename split apks
        run: |
          mkdir -p ${{ env.RELEASE_DIR }}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ${{ env.RELEASE_DIR }}
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ${{ env.RELEASE_DIR }}
          cd ${{ env.RELEASE_DIR }}
          mv app-arm64-v8a-release.apk masiro-${{ env.COMMIT_SHORT_HASH }}-arm64-v8a-release.apk
          mv app-armeabi-v7a-release.apk masiro-${{ env.COMMIT_SHORT_HASH }}-armeabi-v7a-release.apk
          ls -la .
          cd ..

      - name: Locate Android build tools
        run: |
          export ANDROID_BUILD_TOOLS=${{ env.ANDROID_SDK_ROOT }}/build-tools/${{ env.BUILD_TOOLS_VERSION }}
          echo "ANDROID_BUILD_TOOLS=$ANDROID_BUILD_TOOLS" >> $GITHUB_ENV
          ls "$ANDROID_BUILD_TOOLS"/
          test -f "$ANDROID_BUILD_TOOLS/zipalign"
          test -f "$ANDROID_BUILD_TOOLS/apksigner"

      - name: Decode keystore base64 & parse key properties
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > ${{ env.RELEASE_DIR }}/sign.keystore
          echo "${{ secrets.KEY_PROPERTIES }}" > ${{ env.RELEASE_DIR }}/key.properties
          source ${{ env.RELEASE_DIR }}/key.properties
          echo "KS_ALIAS=$keyAlias" >> $GITHUB_ENV
          echo "KS_PASSWORD=$storePassword" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$keyPassword" >> $GITHUB_ENV
          ls -la ${{ env.RELEASE_DIR }}

      - name: Zipalign + apksigner sign split apks
        run: |
          cd ${{ env.RELEASE_DIR }}
          ANDROID_BUILD_TOOLS=${{ env.ANDROID_BUILD_TOOLS }}
          for src_apk in masiro-*-release.apk; do
            echo "===== Processing $src_apk ====="
            "${ANDROID_BUILD_TOOLS}/zipalign" -v 4 "$src_apk" "${src_apk%.apk}-aligned.apk"
            "${ANDROID_BUILD_TOOLS}/apksigner" sign \
              --ks sign.keystore \
              --ks-key-alias ${{ env.KS_ALIAS }} \
              --ks-pass pass:${{ env.KS_PASSWORD }} \
              --key-pass pass:${{ env.KEY_PASSWORD }} \
              --out "${src_apk%.apk}-signed.apk" \
              "${src_apk%.apk}-aligned.apk"
            echo "Signed file: ${src_apk%.apk}-signed.apk"
          done
          ls -la .

      - name: Upload split apks to release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: "${{ env.RELEASE_DIR }}/masiro-${{ env.COMMIT_SHORT_HASH }}-*-release-signed.apk"
          tag: ${{ env.COMMIT_SHORT_HASH }}
          prerelease: true

  build-windows-app:
    name: Windows | Build Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.CI_FLUTTER_VERSION }}
          cache: true

      - name: Get short commit hash
        run: echo "COMMIT_SHORT_HASH=$(git rev-parse --short HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Flutter pub get
        run: flutter pub get

      - name: Build windows release
        run: flutter build windows --release

      - name: Zip windows package
        run: |
          $artifactName="masiro-$env:COMMIT_SHORT_HASH-windows.zip"
          Compress-Archive -Path build\windows\x64\release\* -DestinationPath $artifactName
          echo "BUILD_ARTIFACT=$artifactName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload to release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: ${{ env.BUILD_ARTIFACT }}
          tag: ${{ env.COMMIT_SHORT_HASH }}
          prerelease: true

  build-macos-app:
    name: macOS | Build Release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.CI_FLUTTER_VERSION }}
          cache: true

      - name: Get short commit hash
        run: echo "COMMIT_SHORT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Flutter pub get
        run: flutter pub get

      - name: Build macos release
        run: flutter build macos --release

      - name: Zip macos package
        run: |
          artifact="masiro-${{ env.COMMIT_SHORT_HASH }}-macos.zip"
          cd build/macos/Build/Products/Release
          zip -r "../../../../$artifact" *.app
          cd ../../../../
          echo "BUILD_ARTIFACT=$artifact" >> $GITHUB_ENV

      - name: Upload to release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: ${{ env.BUILD_ARTIFACT }}
          tag: ${{ env.COMMIT_SHORT_HASH }}
          prerelease: true

  build-ios-app:
    name: iOS | Build Release IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.CI_FLUTTER_VERSION }}
          cache: true

      - name: Get short commit hash
        run: echo "COMMIT_SHORT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS release ipa
        run: flutter build ipa --release --export-method ad-hoc

      - name: Prepare artifact
        run: |
          artifact="masiro-${{ env.COMMIT_SHORT_HASH }}-ios.ipa"
          cp build/ios/ipa/*.ipa $artifact
          echo "BUILD_ARTIFACT=$artifact" >> $GITHUB_ENV

      - name: Upload to release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: ${{ env.BUILD_ARTIFACT }}
          tag: ${{ env.COMMIT_SHORT_HASH }}
          prerelease: true
