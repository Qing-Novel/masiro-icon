name: Release Build Manual

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android APK'
        required: true
        type: boolean
        default: true
      build_linux:
        description: 'Build Linux tarball'
        required: true
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows zip'
        required: true
        type: boolean
        default: false
      build_macos:
        description: 'Build macOS dmg'
        required: true
        type: boolean
        default: false
      build_ios:
        description: 'Build iOS ipa (no codesign)'
        required: true
        type: boolean
        default: false
      dry_run:
        description: 'Dry run: upload as workflow artifacts only, do NOT create release'
        required: true
        type: boolean
        default: true

env:
  FLUTTER_VERSION: "3.24.5"

jobs:
  # ------------------------------------------------------------------
  # Linux
  # ------------------------------------------------------------------
  build-linux:
    if: ${{ inputs.build_linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libayatana-appindicator3-dev
      - run: flutter clean
      - run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release
      - name: Pre Packing
        run: |
          pushd build/linux/x64/release/
          mv bundle masiro
          popd
      - name: Pack Linux tarball
        uses: thedoctor0/zip-release@master
        with:
          type: "tar"
          filename: masiro-linux.tar.gz
          directory: build/linux/x64/release/
          path: masiro
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: build/linux/x64/release/masiro-linux.tar.gz

  # ------------------------------------------------------------------
  # Android (使用 KEYSTORE / KEY_PROPERTIES)
  # ------------------------------------------------------------------
  build-android:
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Setup Android signing
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/masiro-release.jks
          echo "${{ secrets.KEY_PROPERTIES }}" > android/key.properties
      - run: flutter clean
      - run: flutter pub get
      - name: Build Android
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons
      - name: Pack Android apk
        run: |
          pushd build/app/outputs/flutter-apk/
          mv app-arm64-v8a-release.apk masiro-arm64_v8a.apk
          mv app-armeabi-v7a-release.apk masiro-armeabi_v7a.apk
          popd
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            build/app/outputs/flutter-apk/masiro-arm64_v8a.apk
            build/app/outputs/flutter-apk/masiro-armeabi_v7a.apk

  # ------------------------------------------------------------------
  # Windows
  # ------------------------------------------------------------------
  build-windows:
    if: ${{ inputs.build_windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter clean
      - run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Pre Packing
        shell: pwsh
        run: |
          cd build/windows/x64/runner
          Rename-Item Release masiro
          cd ../../../../
      - name: Pack Windows tarball
        uses: thedoctor0/zip-release@master
        with:
          type: "zip"
          filename: masiro-windows.zip
          directory: build/windows/x64/runner
          path: masiro
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: build/windows/x64/runner/masiro-windows.zip

  # ------------------------------------------------------------------
  # macOS + iOS (同一台 macos-latest)
  # ------------------------------------------------------------------
  build-macos-and-ios:
    if: ${{ inputs.build_macos || inputs.build_ios }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Ensure platform files
        run: |
          flutter create --platforms=macos,ios .
          flutter clean
          flutter pub get

      # ---------- macOS ----------
      - name: Build MacOS
        if: ${{ inputs.build_macos }}
        run: flutter build macos --release
      - name: Packing MacOS dmg
        if: ${{ inputs.build_macos }}
        run: |
          brew install python-setuptools
          npm install -g appdmg
          appdmg appdmg.json build/masiro-universal.dmg
      - name: Upload MacOS artifacts
        if: ${{ inputs.build_macos }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/masiro-universal.dmg

      # ---------- iOS ----------
      - name: Build iOS ipa
        if: ${{ inputs.build_ios }}
        run: flutter build ios --release --no-codesign
      - name: Packing iOS
        if: ${{ inputs.build_ios }}
        run: |
          mkdir Payload
          mv build/ios/iphoneos/Runner.app Payload
          zip -r9 masiro.ipa Payload
      - name: Upload iOS artifacts
        if: ${{ inputs.build_ios }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: masiro.ipa

  # ------------------------------------------------------------------
  # Release (dry_run = false 时汇总并创建 prerelease)
  # ------------------------------------------------------------------
  release:
    if: ${{ !inputs.dry_run && always() && (inputs.build_linux || inputs.build_android || inputs.build_windows || inputs.build_macos || inputs.build_ios) }}
    needs: [build-linux, build-android, build-windows, build-macos-and-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set short hash
        run: echo "COMMIT_SHORT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release-files
          find all-artifacts -type f \( -name "*.tar.gz" -o -name "*.apk" -o -name "*.zip" -o -name "*.dmg" -o -name "*.ipa" \) -exec cp {} release-files/ \;
          ls -la release-files/
      - name: Create Prerelease
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: "release-files/*"
          tag: ${{ env.COMMIT_SHORT_HASH }}
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
