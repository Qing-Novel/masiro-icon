name: Release Build Manual

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android APK'
        required: true
        type: boolean
        default: true
      build_linux:
        description: 'Build Linux tarball'
        required: true
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows zip (project untested)'
        required: true
        type: boolean
        default: false
      build_macos:
        description: 'Build macOS dmg (project untested)'
        required: true
        type: boolean
        default: false
      dry_run:
        description: 'Dry run: upload as workflow artifacts only, do NOT create release'
        required: true
        type: boolean
        default: true

env:
  FLUTTER_VERSION: "3.41.5"

jobs:
  # ------------------------------------------------------------------
  # Linux
  # ------------------------------------------------------------------
  build-linux:
    if: ${{ inputs.build_linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set short hash
        run: echo "COMMIT_SHORT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Pack tarball
        run: |
          cd build/linux/x64/release
          mv bundle masiro-${{ env.COMMIT_SHORT_HASH }}-linux
          tar -czf masiro-${{ env.COMMIT_SHORT_HASH }}-linux.tar.gz masiro-${{ env.COMMIT_SHORT_HASH }}-linux
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: build/linux/x64/release/masiro-${{ env.COMMIT_SHORT_HASH }}-linux.tar.gz

  # ------------------------------------------------------------------
  # Android (使用 KEYSTORE / KEY_PROPERTIES)
  # ------------------------------------------------------------------
  build-android:
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set short hash
        run: echo "COMMIT_SHORT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Setup Android signing
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/masiro-release.jks
          echo "${{ secrets.KEY_PROPERTIES }}" > android/key.properties
      - run: flutter pub get
      - name: Build APKs
        run: flutter build apk --release --split-per-abi
      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk masiro-${{ env.COMMIT_SHORT_HASH }}-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk masiro-${{ env.COMMIT_SHORT_HASH }}-armeabi-v7a.apk
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            build/app/outputs/flutter-apk/masiro-${{ env.COMMIT_SHORT_HASH }}-arm64-v8a.apk
            build/app/outputs/flutter-apk/masiro-${{ env.COMMIT_SHORT_HASH }}-armeabi-v7a.apk

  # ------------------------------------------------------------------
  # Windows (项目 README 标注“未测试”，按需启用)
  # ------------------------------------------------------------------
  build-windows:
    if: ${{ inputs.build_windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set short hash
        shell: pwsh
        run: echo "COMMIT_SHORT_HASH=$((git rev-parse --short HEAD))" >> $env:GITHUB_ENV
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Pack zip
        shell: pwsh
        run: |
          cd build/windows/x64/runner
          Rename-Item Release masiro-${{ env.COMMIT_SHORT_HASH }}-windows
          Compress-Archive -Path masiro-${{ env.COMMIT_SHORT_HASH }}-windows -DestinationPath masiro-${{ env.COMMIT_SHORT_HASH }}-windows.zip
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: build/windows/x64/runner/masiro-${{ env.COMMIT_SHORT_HASH }}-windows.zip

  # ------------------------------------------------------------------
  # macOS (项目 README 标注“未测试”，按需启用)
  # ------------------------------------------------------------------
  build-macos:
    if: ${{ inputs.build_macos }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set short hash
        run: echo "COMMIT_SHORT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Upload macOS .app bundle
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: build/macos/Build/Products/Release/masiro.app

  # ------------------------------------------------------------------
  # Release（dry_run = false 时，汇总所有 artifact 并创建预发布）
  # ------------------------------------------------------------------
  release:
    if: ${{ !inputs.dry_run && always() && (inputs.build_linux || inputs.build_android || inputs.build_windows || inputs.build_macos) }}
    needs: [build-linux, build-android, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set short hash
        run: echo "COMMIT_SHORT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release-files
          find all-artifacts -type f \( -name "*.tar.gz" -o -name "*.apk" -o -name "*.zip" -o -name "*.dmg" \) -exec cp {} release-files/ \;
          ls -la release-files/
      - name: Create Prerelease
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: "release-files/*"
          tag: ${{ env.COMMIT_SHORT_HASH }}
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}r pub get

      - name: Build iOS release ipa
        run: flutter build ipa --release --export-method ad-hoc

      - name: Prepare artifact
        run: |
          artifact="masiro-${{ env.COMMIT_SHORT_HASH }}-ios.ipa"
          cp build/ios/ipa/*.ipa $artifact
          echo "BUILD_ARTIFACT=$artifact" >> $GITHUB_ENV

      - name: Upload to release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: ${{ env.BUILD_ARTIFACT }}
          tag: ${{ env.COMMIT_SHORT_HASH }}
          prerelease: true
